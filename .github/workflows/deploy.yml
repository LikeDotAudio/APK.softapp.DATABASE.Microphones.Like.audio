name: Publish to microphones.like.audio

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Research/microphones.json"
      - "Research/Wireless Microphone_RF_Components.json"
      - "Research/aes_x230_profile.json"
      - "Research/*.schema.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Ignore the remote sync state and re-upload every file"
        type: boolean
        default: false

# Never let two deploys write to the server at the same time.
concurrency:
  group: ftps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate: every Research record against its JSON Schema, before anything is built.
      - name: Validate Research/ against its schemas
        run: |
          pip install 'jsonschema==4.23.0'
          python3 docs/validate_research.py

      # docs/data is generated, not committed — rebuild it from the source dataset,
      # then check the tree the page reads (config shape, counts, every brand file).
      - name: Build data files
        run: python3 docs/build_data.py && python3 docs/check_data.py

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./docs/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: ${{ inputs.full_sync == true }}
          # Every Python file under docs/ is a build or bench tool, never part of the site — so
          # excluded by pattern, not by name. A named list let kits.py, x230_read.py, build_logo.py
          # and fetch_media.py upload to microphones.like.audio as each was added.
          exclude: |
            **/.git*
            **/.git*/**
            **/*.py
            **/__pycache__/**
            **/README.md
